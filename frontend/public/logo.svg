<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="laser" x1="256" y1="256" x2="380" y2="130">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#FCA5A5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#A5B4FC" stroke-width="0.5">
    <line x1="64" y1="0" x2="64" y2="512"/><line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/><line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/><line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/><line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/><line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/><line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Crosshair outer ring -->
  <circle cx="256" cy="240" r="95" stroke="#A5B4FC" stroke-width="2.5" fill="none" opacity="0.7"/>
  <circle cx="256" cy="240" r="70" stroke="#A5B4FC" stroke-width="2" fill="none" opacity="0.5"/>
  <circle cx="256" cy="240" r="45" stroke="#A5B4FC" stroke-width="1.5" fill="none" opacity="0.35"/>

  <!-- Crosshair ticks -->
  <g stroke="#C7D2FE" stroke-width="3" opacity="0.9">
    <line x1="256" y1="135" x2="256" y2="170"/>
    <line x1="256" y1="310" x2="256" y2="345"/>
    <line x1="151" y1="240" x2="186" y2="240"/>
    <line x1="326" y1="240" x2="361" y2="240"/>
  </g>

  <!-- Center dot -->
  <circle cx="256" cy="240" r="6" fill="#C7D2FE" filter="url(#glow-sm)"/>

  <!-- Laser beam: center → top-right -->
  <line x1="260" y1="236" x2="380" y2="122" stroke="url(#laser)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="382" cy="120" r="5" fill="#FCA5A5" filter="url(#glow)"/>
  <circle cx="382" cy="120" r="14" fill="#F87171" opacity="0.2"/>
  <circle cx="382" cy="120" r="22" fill="#F87171" opacity="0.08"/>

  <!-- LoRa signal waves (bottom-left) -->
  <g filter="url(#glow-sm)">
    <path d="M115 365 Q148 340 181 365" stroke="#34D399" stroke-width="3" fill="none" opacity="0.9"/>
    <path d="M95 395 Q148 360 201 395" stroke="#34D399" stroke-width="3" fill="none" opacity="0.65"/>
    <path d="M75 425 Q148 378 221 425" stroke="#34D399" stroke-width="3" fill="none" opacity="0.4"/>
  </g>

  <!-- CAN bus waveform (top-left) -->
  <polyline points="68,135 90,135 90,110 112,110 112,135 134,135 134,110 156,110 156,135 178,135 178,110 200,110 200,135"
    stroke="#FBBF24" stroke-width="3" fill="none" opacity="0.85" stroke-linejoin="round" filter="url(#glow-sm)"/>

  <!-- Distance arc -->
  <path d="M190 345 A105 105 0 0 1 322 345" stroke="#60A5FA" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.55"/>

  <!-- Distance label -->
  <text x="256" y="380" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="18" fill="#93C5FD" opacity="0.6" letter-spacing="1">12.5m</text>
</svg>
